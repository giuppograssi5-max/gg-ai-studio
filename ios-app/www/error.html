<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GG · Offline</title>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#111;text-align:center}@media(prefers-color-scheme:dark){body{background:#111;color:#eee}p{color:#aaa!important}}.logo{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:18px;background:#212121;color:#ededed;font-weight:700;font-size:30px;letter-spacing:-2px}h1{font-size:22px;margin:20px 0 6px}p{color:#666;margin:0 0 22px;line-height:1.5}button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 26px;background:#0071e3;color:#fff}</style></head>
<body><main><span class="logo">GG</span><h1>You're offline</h1><p>GG needs an internet connection.<br>Check Wi‑Fi or mobile data and try again.</p><button id="retry" type="button">Try again</button></main>
<script>
const url = 'https://gg-ai-studio.netlify.app/?source=ios-app';
const go = () => location.replace(url);
document.getElementById('retry').onclick = go;
addEventListener('online', go);
</script></body></html>
